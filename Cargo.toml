[package]
name = "card_io_fw"
description = "Card/IO ECG device firmware"
version = "0.1.0"
authors = ["Dániel Buga <bugadani@gmail.com>"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
embedded-graphics = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.2.0", features = ["async"] }
embedded-io = "0.6"
embedded-io-async = "0.7"
embedded-menu = "0.7.0"
embassy-net = { version = "0.9", features = [
    "tcp",
    "dhcpv4",
    "dns",
    "medium-ethernet",
] }
embassy-sync = "0.8.0"
embassy-executor = "0.10"
embassy-time = "0.5.0"

heapless = "0.9"
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false }
signal-processing = { path = "signal-processing" }
object-chain = "0.1.3"
edge-http = { version = "0.8", default-features = false, features = ["io"] }
edge-nal = { version = "0.7", default-features = false }
edge-nal-embassy = { version = "0.9", default-features = false, features = [
    "proto-ipv4",
    "tcp",
] }
defmt = "1"
device-auth-firmware = { git = "https://github.com/card-io-ecg/device-auth.git", rev = "d59c2676ece41e86387fa6b1cff86f0396d325a1" }
ufmt = "0.2.0"

smoltcp = { version = "0.13.0", default-features = false, features = [
  "dns-max-server-count-2",
  "proto-ipv4",
] }

[dependencies]
cfg-if = "1"

embassy-futures = { version = "0.1.0" }
embassy-executor = { workspace = true, features = ["nightly"] }
embassy-time.workspace = true

rtt-target = { version = "0.6.0", optional = true }
panic-rtt-target = { version = "0.2.0", optional = true }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["embedded-storage"] }
embedded-storage = "0.3"
esp-storage = "0.10"
ekv = { version = "1.0", features = ["crc"] }
# ekv is generic over this version's RawMutex.
embassy-sync-06 = { package = "embassy-sync", version = "0.6" }
esp-hal = { version = "1.2.0", features = ["unstable"] }
esp-sync = { version = "0.3" }
esp-rtos = { version = "0.4", features = ["embassy", "esp-alloc"] }
esp-metadata-generated = "0.5"
esp-backtrace = { version = "0.20", features = ["panic-handler", "semihosting"], optional = true }
esp-println = { version = "0.18", default-features = false, optional = true, features = [
    "critical-section",
] }
esp-alloc = "0.11"
esp-radio = { version = "1.0.0-beta.1", features = ["wifi"], optional = true }

display-interface = "0.5"
display-interface-spi = "0.5"
ssd1306 = { version = "0.10.0", features = ["async", "graphics"] }
maybe-async-cfg = "=0.2.4"

portable_atomic_enum = "0.3.1"
config-site = { path = "config-site", default-features = false, features = [
    "embedded",
] }
critical-section = "1.2"
config-types = { path = "config-types" }
gui = { path = "gui" }
macros = { path = "macros" }
embassy-alloc-taskpool = { path = "embassy-alloc-taskpool" }
ads129x = { path = "ads129x" }
max17055 = { path = "max17055" }
signal-processing = { workspace = true, features = ["alloc"] }
replace_with = { version = "0.1", default-features = false }
static_cell = { version = "2.0.0" }
edge-http = { workspace = true, optional = true }
edge-nal = { workspace = true, optional = true }
edge-nal-embassy = { workspace = true, optional = true }
network-services = { path = "network-services", optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

embedded-graphics.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-hal-bus.workspace = true
embedded-io.workspace = true
embedded-io-async.workspace = true
embedded-menu.workspace = true
embassy-net = {workspace = true, optional = true }
embassy-sync.workspace = true

heapless.workspace = true
object-chain.workspace = true
ufmt.workspace = true

defmt.workspace = true

smoltcp = { workspace = true, optional = true }
enumset = "1.1.3"

[dev-dependencies]
device-auth-firmware.workspace = true
embedded-test = { version = "0.7", features = ["defmt", "embassy-010", "external-executor"] }

[target.'cfg(target_arch = "xtensa")'.dev-dependencies]
semihosting = { version = "0.1", features = ["openocd-semihosting"] }

[[bin]]
name = "card_io_fw"
path = "src/main.rs"
test = false

# Hardware-in-the-loop tests, run with `cargo xtask hil`.
[[test]]
name = "hil"
harness = false

[features]
default = ["defmt", "rtt"]
#default = ["defmt", "esp-println"]

# Enable Wi-Fi features. The purpose of this feature is to shorten the debugging iteration time by removing a big chunk of the binary.
wifi = ["dep:esp-radio", "dep:edge-http", "dep:edge-nal", "dep:edge-nal-embassy", "dep:embassy-net", "dep:network-services", "dep:rand_core", "esp-radio/unstable", "esp-rtos/esp-radio", "config-site/compress", "config-site/serve"]

hw_v4 = ["esp32s3"]
# hw_v5 skipped
hw_v6 = [] # S3 and C6 options
# hw_v7 skipped
hw_v8 = [] # S3, C5, C6 and C61 options

# MCU options
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-backtrace?/esp32s3",
    "esp-radio?/esp32s3",
    "esp-rtos/esp32s3",
    "esp-println?/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-storage/esp32s3",
    "esp-metadata-generated/esp32s3",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-backtrace?/esp32c6",
    "esp-radio?/esp32c6",
    "esp-rtos/esp32c6",
    "esp-println?/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-storage/esp32c6",
    "esp-metadata-generated/esp32c6",
]

# Signal processing
downsampler-light = [] # uses IIR-based filtering and less memory

defmt = [
    "config-types/defmt",
    "esp-bootloader-esp-idf/defmt",
    "esp-storage/defmt",
    "embedded-io/defmt-03",
    "embedded-graphics/defmt",
    "embedded-hal-bus/defmt-03",
    "esp-radio?/defmt",
    "esp-rtos/defmt",
    "esp-hal/defmt",
    "esp-backtrace?/defmt",
    "esp-println?/defmt-espflash",

    "config-site/defmt",
    "ads129x/defmt",
    "max17055/defmt",
    "edge-http?/defmt",
    "edge-nal-embassy?/defmt",
    "gui/defmt",
    "signal-processing/defmt",
    "network-services?/defmt",
    "heapless/defmt",
    "display-interface/defmt-03",

    "embassy-executor/defmt",
    "embassy-net?/defmt",
    "rtt-target?/defmt",
    "panic-rtt-target?/defmt",
]

rtt = ["dep:rtt-target", "dep:panic-rtt-target"]
esp-println = ["dep:esp-println", "esp-println/jtag-serial", "dep:esp-backtrace"]

[package.metadata.espflash]
partition_table = "partitions.csv"
format = "esp-bootloader"

[workspace]
members = [
    ".",
    "ads129x",
    "config-types",
    "embassy-alloc-taskpool",
    "gui",
    "macros",
    "network-services",
    "signal-processing",
    "xtask",
]

[profile.dev]
opt-level = 3
codegen-units = 1
lto = "thin"

[profile.release]
debug = true
codegen-units = 1
lto = "fat"

[profile.lto]
inherits = "release"
lto = "fat"

[patch.crates-io]
ssd1306 = { git = "https://github.com/card-io-ecg/ssd1306", branch = "contiguous" }
