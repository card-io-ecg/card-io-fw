[package]
name = "network-services"
version = "0.1.0"
edition = "2021"

[dependencies]
cfg-if = "1"
defmt = { workspace = true, optional = true }
device-auth-firmware.workspace = true
edge-http.workspace = true
embassy-net.workspace = true
embassy-time.workspace = true
embedded-io-async.workspace = true
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "0557076932c55f32e3e448566a99137012187aab", default-features = false, features = ["p256"] }
heapless.workspace = true

[dev-dependencies]
embassy-futures = "0.1"
embassy-crypto = { workspace = true }
embassy-crypto-rand = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { workspace = true, features = ["all"] }

[features]
defmt = [
    "dep:defmt",
    "edge-http/defmt",
    "embassy-net/defmt",
    "embedded-tls/defmt",
    "heapless/defmt",
]
