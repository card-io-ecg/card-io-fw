name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  merge_group:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: format check
        run: cargo fmt --check

  check:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        version: ["v6c6", "v8s3"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.version }}

      - name: check
        run: cargo xcheck ${{ matrix.version }}

      - name: check with wifi
        run: cargo xcheck ${{ matrix.version }} --with-wifi

  build:
    if: github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        version: ["v6c6", "v8s3"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          espflash: true
          cache-key: ${{ matrix.version }}

      - name: build
        run: cargo xbuild ${{ matrix.version }} release --with-wifi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          nightly: false

      - name: test
        run: cargo xtask test
