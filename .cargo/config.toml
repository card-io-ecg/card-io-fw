[target.xtensa-esp32s3-none-elf]
runner    = "probe-rs run --preverify --always-print-stacktrace --idf-partition-table partitions.csv"
#runner = "espflash flash -M --erase-parts=otadata --log-format=defmt --partition-table partitions.csv -s 8mb"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,-Tlinkall.x",
]

[target.riscv32imac-unknown-none-elf]
runner    = "probe-rs run --preverify --always-print-stacktrace --idf-partition-table partitions.csv"
#runner = "espflash flash -M --erase-parts=otadata --log-format=defmt --partition-table partitions.csv -s 8mb"
rustflags = [
  "-C", "force-frame-pointers",
  "-C", "link-arg=-Tlinkall.x",
]

[alias]
xtask = "run --package xtask --"
xcheck = "xtask check"
xtest = "xtask test"
xclippy = "xtask extra-check"
xbuild = "xtask build"
xrun = "xtask run"
xdoc = "xtask doc"
example = "xtask example"
monitor = "xtask monitor"

[env]
DEFMT_LOG = "card_io_fw=debug,info"
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = "LLFF"
# The heap takes its second region from the main stack; keep the stack from shrinking unnoticed.
ESP_HAL_CONFIG_ENSURE_MAIN_STACK_MINIMUM = "65536"
EKV_MAX_PAGE_COUNT = "1008"
EKV_MAX_VALUE_SIZE = "90000"
EKV_MAX_KEY_SIZE = "16"
EKV_MAX_CHUNK_SIZE = "1024"
