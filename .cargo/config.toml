# Settings for all chips. The settings of one chip are in `<chip>.toml`, which xtask passes with
# `--config`.

[alias]
xtask = "run --package xtask --"
xcheck = "xtask check"
xtest = "xtask test"
xclippy = "xtask extra-check"
xbuild = "xtask build"
xrun = "xtask run"
xdoc = "xtask doc"
example = "xtask example"
monitor = "xtask monitor"

[env]
# edge_dhcp and edge_http at debug log the leases and the connections of the setup access point.
DEFMT_LOG = "card_io_fw=debug,edge_dhcp=debug,edge_http=debug,info"
ESP_ALLOC_CONFIG_HEAP_ALGORITHM = "LLFF"
# The heap takes its second region from the main stack; keep the stack from shrinking unnoticed.
ESP_HAL_CONFIG_ENSURE_MAIN_STACK_MINIMUM = "65536"
EKV_MAX_PAGE_COUNT = "1008"
EKV_MAX_VALUE_SIZE = "90000"
EKV_MAX_KEY_SIZE = "16"
EKV_MAX_CHUNK_SIZE = "1024"
